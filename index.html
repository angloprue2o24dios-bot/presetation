<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La célula · Un recorrido por dentro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
:root{--bg:#000;--ink:#F2ECFA;--soft:#A99BC8;--c:#A98BE8;--head:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;--body:"Newsreader",Georgia,"Times New Roman",serif}
*{box-sizing:border-box;margin:0}
html{background:var(--bg)}
body{color:var(--ink);font-family:var(--body)}
.track{position:relative;height:1180vh}
.stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;background:radial-gradient(circle at 66% 50%,#1b1033 0,#0a0612 55%,#000 100%)}
#svg{position:absolute;inset:0;width:100%;height:100%}
.scrim{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,rgba(0,0,0,.96) 0,rgba(0,0,0,.88) 26%,rgba(0,0,0,0) 46%)}
.copy{position:absolute;left:6vw;top:50%;transform:translateY(-50%);width:min(30rem,34vw);padding-left:1.4rem;border-left:5px solid var(--c);transition:border-color .3s}
.copy h2{font:700 clamp(2rem,3.9vw,3.4rem)/1.05 var(--head);letter-spacing:-.02em}
.copy.intro h2{font-size:clamp(3.2rem,7.2vw,6.4rem);letter-spacing:-.035em}
.copy p{font-size:clamp(1.1rem,1.5vw,1.4rem);line-height:1.55;margin-top:1rem;max-width:34ch}
.copy .fact{font:500 .95rem/1.4 var(--head);color:var(--soft);margin-top:1.2rem}
.brand{position:absolute;left:6vw;top:2rem;font:500 .95rem var(--head);color:var(--soft)}
nav{position:absolute;right:2.2vw;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:.9rem}
nav button{width:14px;height:14px;border-radius:50%;border:2px solid var(--k);background:transparent;cursor:pointer;padding:0;transition:background .2s,transform .2s}
nav button.on{background:var(--k);transform:scale(1.35)}
nav button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.bar{position:absolute;left:0;top:0;height:4px;width:0;background:var(--c)}
.part{transition:opacity .2s,filter .3s;transform-box:fill-box;transform-origin:center;animation:bob 7s ease-in-out infinite alternate}
@media (max-aspect-ratio:1/1){
 .scrim{background:linear-gradient(0deg,rgba(0,0,0,.97) 0,rgba(0,0,0,.9) 36%,rgba(0,0,0,0) 58%)}
 .copy{left:6vw;right:12vw;top:auto;bottom:5vh;transform:none;width:auto;padding-left:1rem}
 .copy p{max-width:none;margin-top:.6rem}
 .copy.intro h2{font-size:clamp(2.6rem,14vw,4.5rem)}
 .brand{top:1.2rem}
}

.stage::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:1;background:radial-gradient(ellipse at center,transparent 50%,rgba(0,0,0,.75) 100%)}
.copy,nav,.brand{z-index:2}.bar{z-index:3}
.dust{position:absolute;top:100%;border-radius:50%;background:#fff;opacity:.22;pointer-events:none;animation:drift linear infinite}
.w{display:inline-block}
.copy.enter .w{animation:up .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*70ms)}
.copy.enter p{animation:up .9s .3s cubic-bezier(.2,.8,.2,1) both}
.copy.enter .fact{animation:up .9s .5s cubic-bezier(.2,.8,.2,1) both}
.copy.intro .fact::after{content:"";display:inline-block;width:.55em;height:.55em;margin-left:.8rem;border-right:2px solid;border-bottom:2px solid;transform:rotate(45deg);animation:nudge 1.4s ease-in-out infinite}
.mem{animation-name:breathe;animation-duration:5s}
.flow{animation:flow 1.6s linear infinite}.flow2{animation:flow2 2s linear infinite}
.spin{animation:dash 16s linear infinite}
.beat{animation:beat 1.6s ease-in-out infinite alternate}
.vs circle,.tw circle{transform-box:fill-box;transform-origin:center;animation:bob2 3.2s ease-in-out infinite alternate}
.vs circle:nth-child(2){animation-delay:-1s}.vs circle:nth-child(3){animation-delay:-2s}.vs circle:nth-child(4){animation-delay:-.5s}
.tw circle{animation-name:tw;animation-duration:2.6s}.tw circle:nth-child(odd){animation-delay:-1.3s}.tw circle:nth-child(3n){animation-delay:-.6s}
@keyframes bob{from{transform:translate(0,-5px) rotate(-.6deg)}to{transform:translate(0,5px) rotate(.6deg)}}
@keyframes breathe{from{transform:scale(.994)}to{transform:scale(1.008)}}
@keyframes bob2{from{transform:translate(-3px,-4px)}to{transform:translate(3px,4px)}}
@keyframes tw{from{opacity:.2}to{opacity:1}}
@keyframes flow{to{stroke-dashoffset:-17}}
@keyframes flow2{to{stroke-dashoffset:-15}}
@keyframes dash{to{stroke-dashoffset:-270}}
@keyframes beat{from{opacity:.5}to{opacity:1}}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes nudge{50%{transform:translateY(7px) rotate(45deg)}}
@keyframes drift{to{transform:translate3d(var(--dx),-115vh,0)}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important}}

.mode{position:absolute;right:2.2vw;top:1.4rem;z-index:4;width:44px;height:44px;display:grid;place-items:center;padding:0;color:var(--ink);background:transparent;border:1px solid var(--soft);border-radius:50%;cursor:pointer;transition:background .2s,color .2s,transform .3s}.mode:hover{transform:rotate(60deg) scale(1.08)}
.mode:hover{background:var(--ink);color:var(--bg)}
.mode:focus-visible{outline:3px solid var(--c);outline-offset:3px}
html.light{--bg:#fff;--ink:#2A1B4A;--soft:#5E4F80}
html.light .stage{background:#fff}
html.light .scrim{background:linear-gradient(90deg,rgba(255,255,255,.96) 0,rgba(255,255,255,.88) 26%,rgba(255,255,255,0) 46%)}
html.light .stage::after,html.light .dust{display:none}
html.light .part,html.light .flow,html.light .flow2,html.light .spin,html.light .beat,html.light .vs circle,html.light .tw circle{animation:none}
@media (max-aspect-ratio:1/1){html.light .scrim{background:linear-gradient(0deg,rgba(255,255,255,.97) 0,rgba(255,255,255,.9) 36%,rgba(255,255,255,0) 58%)}}

.iabtn{right:calc(2.2vw + 56px);font:700 .95rem var(--head);letter-spacing:.02em}
.iabtn:hover{transform:scale(1.1)}
html.ia .iabtn{background:var(--ink);color:var(--bg);animation:glowp 1.8s ease-in-out infinite}
html.ia .copy .fact{color:var(--ink);font-size:1.05rem}
html.ia .part{animation-duration:4s}
.stage::before{content:"";display:none;position:absolute;left:0;right:0;top:-160px;height:160px;pointer-events:none;z-index:1;background:linear-gradient(180deg,transparent,rgba(130,200,255,.08),transparent);animation:scan 5s linear infinite}
html.ia .stage::before{display:block}
@keyframes scan{to{transform:translateY(calc(100vh + 160px))}}
@keyframes glowp{50%{box-shadow:0 0 0 8px rgba(169,139,232,.25),0 0 18px #A98BE8}}

footer{background:var(--bg);color:var(--ink);padding:14vh 6vw 10vh;border-top:1px solid rgba(128,128,160,.3)}
footer h2{font:700 clamp(2rem,4vw,3.4rem)/1.05 var(--head);letter-spacing:-.02em;margin-bottom:3rem}
footer dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(15rem,1fr));gap:2.6rem 3rem;max-width:64rem}
footer dt{font:500 .98rem/1.4 var(--head);color:var(--soft)}
footer dd{font:700 clamp(1.5rem,2.4vw,2rem)/1.2 var(--head);margin:.4rem 0 0}
footer dd.cl{display:flex;align-items:center;gap:.7rem}
.cr{opacity:0;transform:translateY(18px);transition:opacity .7s,transform .7s;transition-delay:calc(var(--i)*100ms)}
.cr.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.cr{opacity:1;transform:none;transition:none}}

nav{gap:1rem}
nav button{position:relative}
nav button::after{content:"";position:absolute;inset:-10px}
.brand{font-size:.9rem}
@media (max-aspect-ratio:1/1){
 .copy{bottom:calc(3svh + env(safe-area-inset-bottom,0px))}
 .copy h2{font-size:clamp(1.55rem,7vw,2.2rem)}
 .copy.intro h2{font-size:clamp(2.6rem,13vw,4.2rem)}
 .copy p{font-size:1rem;line-height:1.45}
 .copy .fact,html.ia .copy .fact{font-size:.85rem;margin-top:.8rem}
 .brand{top:1.5rem}
}
@media (max-height:520px) and (min-aspect-ratio:101/100){
 .copy{width:min(24rem,40vw)}
 .copy h2{font-size:1.5rem}.copy.intro h2{font-size:2.6rem}
 .copy p{font-size:.95rem;line-height:1.4;margin-top:.5rem}
 .copy .fact,html.ia .copy .fact{font-size:.8rem;margin-top:.6rem}
 .brand{top:1rem}.mode{top:.8rem}
}
@media (max-width:900px) and (min-aspect-ratio:101/100) and (min-height:521px){
 .copy{width:40vw}.copy h2{font-size:1.8rem}.copy p{font-size:1rem}
}
</style>
</head>

</dl>

<script>
const P=[
{n:"Membrana plasmática",c:"#FF6FA0",x:915,y:350,s:3.6,w:120,d:"Una doble capa de lípidos que envuelve la célula. Decide qué entra y qué sale: nutrientes, agua y desechos.",f:"Grosor: unos 8 nm",a:"Los puntos rosados son nutrientes que entran y llegan a la mitocondria; los lilas son desechos que salen."},
{n:"Núcleo",c:"#A98BE8",x:430,y:320,s:2.6,w:250,d:"Guarda el ADN, las instrucciones para fabricar cada proteína. Una doble membrana con poros lo protege y controla el paso de mensajes.",f:"Diámetro: 5–10 µm",a:"Los puntos violetas son copias del ADN (ARN mensajero) que salen hacia el retículo para fabricar proteínas."},
{n:"Mitocondria",c:"#4FD6CC",x:730,y:230,s:3.8,w:200,d:"La central de energía. Convierte nutrientes y oxígeno en ATP, el combustible de la célula. Sus pliegues internos, las crestas, aumentan la superficie de trabajo.",f:"Largo: 0,5–10 µm",a:"Los puntos amarillos son ATP, la energía que la mitocondria envía al núcleo, al Golgi y a la membrana."},
{n:"Retículo endoplasmático rugoso",c:"#E889B0",x:420,y:525,s:2.3,w:340,d:"Una red de membranas cubierta de ribosomas. Allí se fabrican las proteínas y se pliegan antes de salir hacia su destino.",f:"Ribosomas: unos 25 nm",a:"Los puntos rosas son proteínas recién hechas que viajan en vesículas hacia el Golgi."},
{n:"Aparato de Golgi",c:"#E0B04A",x:680,y:500,s:3.8,w:170,d:"Recibe las proteínas, las clasifica, las etiqueta y las empaqueta en vesículas que viajan al lugar donde se necesitan.",f:"Pila de 4 a 8 sacos aplanados",a:"Los puntos dorados son vesículas con proteínas empaquetadas que salen hacia la membrana para enviarse fuera de la célula."},
{n:"Lisosoma",c:"#9BE07F",x:230,y:260,s:7,w:70,d:"Digiere desechos y piezas gastadas con enzimas. Es el sistema de reciclaje de la célula.",f:"Diámetro: 0,1–1,2 µm",a:"Los puntos claros son material que entra para ser digerido; los verdes son piezas recicladas que vuelven a la célula."}
];
const OV={ov:1};
const stages=[OV];P.forEach((p,i)=>stages.push({p:i},OV));
const N=stages.length,last=N-1;
const $=id=>document.getElementById(id);
const cam=$("cam"),svg=$("svg"),copy=$("copy"),scrim=$("scrim"),track=$("track"),bar=$("bar");
const parts=[...document.querySelectorAll(".part")];
const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v));
const ss=v=>{v=clamp(v);return v*v*(3-2*v)};
let portrait=false,pf=1,ovS=1.15,shown=-1,wasOn=false,glow=-2,light=false,ia=false,fkey="",visW=1600;

function layout(){
 const a=innerWidth/innerHeight;portrait=a<=1;
 svg.setAttribute("preserveAspectRatio",portrait?"xMidYMid slice":"xMidYMid meet");
 visW=portrait?900*a:1600;
 ovS=portrait?Math.min(1.15,visW*.95/860):1.15;
 pf=portrait?Math.min(1,visW/640):1;
}
function camFor(st){
 if(st.ov)return{x:500,y:350,s:ovS,ox:800,oy:portrait?300:450};
 const p=P[st.p];
 return{x:p.x,y:p.y,s:portrait?Math.min(p.s,visW*.92/p.w):p.s,ox:portrait?800:1060,oy:portrait?270:450};
}
const content=i=>i===0?{n:"La célula",c:"#A98BE8",d:"La unidad básica de la vida. Esta es una célula animal: una fábrica diminuta donde cada parte tiene un trabajo.",f:"Desliza para explorar",a:"Modo IA: cada punto en movimiento muestra qué envía cada parte y hacia dónde.",intro:1}
 :i===last?{n:"Todo trabaja junto",c:"#F2ECFA",d:"Del ADN a la energía, del empaquetado al reciclaje: la célula coordina todas sus partes en cada segundo.",f:"Y esto ocurre en cada célula de tu cuerpo",a:"Nutrientes, energía y proteínas viajan sin parar de una parte a otra."}
 :stages[i].p!==undefined?P[stages[i].p]:null;

function setText(i){
 if(i===shown)return;shown=i;
 const c=content(i);if(!c)return;
 $("t").innerHTML=c.n.split(" ").map((w,j)=>`<span class="w" style="--i:${j}">${w}</span>`).join(" ");$("d").textContent=c.d;$("f").textContent=ia&&c.a?c.a:c.f;
 copy.style.setProperty("--c",cc(c.c));copy.classList.toggle("intro",!!c.intro);
 bar.style.background=cc(c.c);
}
function update(){
 const max=track.offsetHeight-innerHeight;
 const pr=clamp(scrollY/max);bar.style.width=pr*100+"%";
 const t=pr*last,i=Math.min(Math.floor(t),last-1),f=t-i;
 const e=ss((f-.2)/.6),A=camFor(stages[i]),B=camFor(stages[i+1]);
 const L=(a,b)=>a+(b-a)*e;
 const s=Math.exp(L(Math.log(A.s),Math.log(B.s)));
 cam.setAttribute("transform",`translate(${L(A.ox,B.ox)} ${L(A.oy,B.oy)}) rotate(${(light?0:1)*(i%2?-1:1)*Math.sin(e*Math.PI)*1.8}) scale(${s}) translate(${-(L(A.x,B.x)+300)} ${-(L(A.y,B.y)+100)})`);
 const k=Math.round(t),d=Math.abs(t-k),st=stages[k];
 setText(k);
 const vis=content(k)?clamp(1-(d-.1)/.2):0;
 copy.style.opacity=vis;scrim.style.opacity=vis*.95;
 const on=vis>.05;
 if(on&&!wasOn){copy.classList.remove("enter");void copy.offsetWidth;copy.classList.add("enter")}
 if(!on&&wasOn)copy.classList.remove("enter");
 wasOn=on;
 const act=st.p!==undefined?st.p:-1,z=act>=0?clamp(1-d/.5):0;
